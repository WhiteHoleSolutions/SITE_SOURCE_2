services:
  # Web Application with Persistent Disk for SQLite
  - type: web
    name: white-hole-solutions
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    disk:
      name: sqlite-data
      mountPath: /app/disk
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: file:/app/disk/production.db
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REVOLUT_MERCHANT_SECRET_KEY
        sync: false
      - key: REVOLUT_MERCHANT_API_URL
        value: https://merchant.revolut.com/api
      - key: REVOLUT_MERCHANT_API_VERSION
        value: 2026-08-17
      - key: REVOLUT_MERCHANT_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: admin@whiteholesolutions.com
      - key: ADMIN_PASSWORD
        generateValue: true
